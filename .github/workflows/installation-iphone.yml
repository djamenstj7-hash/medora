name: Installer Medora depuis un iPhone

on:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: Installer ou mettre à jour Supabase
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  installation:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extraire le projet
        run: unzip -q medora-livraison.zip -d "$RUNNER_TEMP/medora-source"
      - name: Lire la configuration Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Vérifier les variables publiques
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo 'Variable VITE_SUPABASE_URL manquante'; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo 'Variable VITE_SUPABASE_PUBLISHABLE_KEY manquante'; exit 1; }
      - name: Installer Supabase
        if: ${{ inputs.deploy_backend }}
        working-directory: ${{ runner.temp }}/medora-source/medora
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Variable SUPABASE_PROJECT_REF manquante'; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Secret SUPABASE_ACCESS_TOKEN manquant'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Secret SUPABASE_DB_PASSWORD manquant'; exit 1; }
          npx --yes supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase db push --yes
          npx --yes supabase functions deploy generate-quiz --use-api
          npx --yes supabase functions deploy evaluate-feynman --use-api
          npx --yes supabase functions deploy submit-review --use-api
      - name: Installer les dépendances
        working-directory: ${{ runner.temp }}/medora-source/medora
        run: npm ci
      - name: Tester le moteur
        working-directory: ${{ runner.temp }}/medora-source/medora
        run: npm test
      - name: Construire la PWA
        working-directory: ${{ runner.temp }}/medora-source/medora
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/medora-source/medora/dist
      - name: Publier sur GitHub Pages
        id: publication
        uses: actions/deploy-pages@v4
